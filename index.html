<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mom&PopTunesByDom.com</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="player-shell">

    <section class="player-card" aria-labelledby="page-title">

      <!-- HEADER -->

      <header class="player-header">

        <div class="header-copy">

          <p class="eyebrow">
            1960s–1970s Collection
          </p>

          <h1 id="page-title">
            Marie & Jerry's Vinyl Player
          </h1>

        </div>


        <div class="meter-images" aria-hidden="true">

          <img
            src="images/meter-left.png"
            alt=""
            class="meter-image"
          >

          <img
            src="images/meter-right.png"
            alt=""
            class="meter-image"
          >

        </div>

      </header>


      <!-- YOUTUBE PLAYER -->

      <div class="video-wrap">
        <div id="youtube-player"></div>
      </div>


      <!-- CURRENT TRACK -->

      <section
        class="track-info"
        aria-live="polite"
      >

        <p
          id="status"
          class="status"
        >
          Loading your record…
        </p>

        <h2 id="track-title">
          Song goes here.
        </h2>

        <p id="track-details">
          Artist and album will appear here.
        </p>

      </section>


      <!-- MAIN CONTROLS -->

      <div
        class="controls"
        aria-label="Music controls"
      >

        <button
          id="previous-button"
          type="button"
          disabled
        >
          Previous
        </button>


        <button
          id="play-button"
          class="primary"
          type="button"
          disabled
        >
          Play
        </button>


        <button
          id="next-button"
          type="button"
          disabled
        >
          Next
        </button>


        <button
          id="shuffle-button"
          class="shuffle-toggle"
          type="button"
          aria-pressed="true"
          disabled
        >
          Shuffle: On
        </button>

      </div>


      <!-- VOLUME -->

      <div class="secondary-controls">

        <label for="volume-control">
          Volume
        </label>

        <input
          id="volume-control"
          type="range"
          min="0"
          max="100"
          step="1"
          value="70"
          aria-label="Volume"
        >

      </div>


      <!-- RECORD LIBRARY -->

      <section
        class="track-browser"
        aria-labelledby="library-title"
      >

        <div class="track-browser-header">

          <h2 id="library-title">
            Record Library
          </h2>

          <span id="track-count">
            0 tracks
          </span>

        </div>


        <div class="track-search-wrap">

          <label
            class="visually-hidden"
            for="track-search"
          >
            Search record library
          </label>

          <input
            id="track-search"
            type="search"
            placeholder="Search artist, album or song..."
            autocomplete="off"
            spellcheck="false"
          >

        </div>


        <div
          id="track-list"
          class="track-list"
          aria-label="Available tracks"
        ></div>

      </section>

    </section>

  </main>


  <!--
    Load our code first so the YouTube-ready callback
    already exists when Google's API finishes loading.
  -->

  <script src="app.js"></script>

  <script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
